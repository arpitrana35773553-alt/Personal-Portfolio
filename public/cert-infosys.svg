<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1118" />
      <stop offset="50%" stop-color="#111c29" />
      <stop offset="100%" stop-color="#070d14" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#f9e076" />
      <stop offset="100%" stop-color="#aa8012" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#00ffaa" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="850" fill="url(#bgGrad)" />
  
  <!-- Outer Tech Border -->
  <rect x="30" y="30" width="1140" height="790" rx="16" fill="none" stroke="rgba(0, 212, 255, 0.25)" stroke-width="2" />
  <rect x="45" y="45" width="1110" height="760" rx="12" fill="none" stroke="rgba(212, 175, 55, 0.3)" stroke-dasharray="12 6" stroke-width="1.5" />
  
  <!-- Corner Tech Crosshairs -->
  <path d="M20 50 L50 50 L50 20" stroke="#00d4ff" stroke-width="3" fill="none" />
  <path d="M1180 50 L1150 50 L1150 20" stroke="#00d4ff" stroke-width="3" fill="none" />
  <path d="M20 800 L50 800 L50 830" stroke="#00d4ff" stroke-width="3" fill="none" />
  <path d="M1180 800 L1150 800 L1150 830" stroke="#00d4ff" stroke-width="3" fill="none" />
  
  <!-- Header Branding -->
  <text x="600" y="140" text-anchor="middle" fill="#00d4ff" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="700" letter-spacing="6">INFOSYS SPRINGBOARD · MOOC</text>
  <text x="600" y="220" text-anchor="middle" fill="url(#goldGrad)" font-family="'Segoe UI', sans-serif" font-size="52" font-weight="800" letter-spacing="4">CERTIFICATE OF COMPLETION</text>
  
  <!-- Subtitle -->
  <text x="600" y="280" text-anchor="middle" fill="#8b9ea8" font-family="'Segoe UI', sans-serif" font-size="20" letter-spacing="2">THIS IS PROUDLY PRESENTED TO</text>
  
  <!-- Name -->
  <text x="600" y="380" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="64" font-weight="900" letter-spacing="3">ARPIT RANA</text>
  <line x1="350" y1="410" x2="850" y2="410" stroke="url(#cyanGlow)" stroke-width="2" />
  
  <!-- Course Description -->
  <text x="600" y="470" text-anchor="middle" fill="#b8c7d9" font-family="'Segoe UI', sans-serif" font-size="24">For successfully completing the course</text>
  <text x="600" y="530" text-anchor="middle" fill="url(#goldGrad)" font-family="'Segoe UI', sans-serif" font-size="44" font-weight="800" letter-spacing="2">PROGRAMMING USING C</text>
  
  <!-- Academic Badge Details -->
  <rect x="380" y="580" width="440" height="50" rx="25" fill="rgba(0, 212, 255, 0.08)" stroke="rgba(0, 212, 255, 0.4)" stroke-width="1" />
  <text x="600" y="612" text-anchor="middle" fill="#00d4ff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="1.5">ISSUED BY INFOSYS SPRINGBOARD · ONLINE</text>
  
  <!-- Footer Verification -->
  <text x="100" y="750" fill="#5f6878" font-family="'Segoe UI', sans-serif" font-size="15">VERIFIED CREDENTIAL</text>
  <text x="100" y="775" fill="#8b9ea8" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600">ID: INFOSYS-SP-C-2025</text>
  
  <text x="1100" y="750" text-anchor="end" fill="#5f6878" font-family="'Segoe UI', sans-serif" font-size="15">DATE OF ISSUANCE</text>
  <text x="1100" y="775" text-anchor="end" fill="#8b9ea8" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600">ACADEMIC SESSION 2025</text>
</svg>
